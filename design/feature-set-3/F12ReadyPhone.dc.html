<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coming back: your last performance is ready (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&amp;family=JetBrains+Mono:wght@500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 780px; position: relative; overflow: hidden; background: #1A0B0A; font-family: Manrope, system-ui, sans-serif">
<dc-import name="F11StagePhone" prog-open="none" hint-size="390px,780px"></dc-import>
<sc-if value="{{show}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; inset: 0; z-index: 60; background: rgba(8,3,2,0.62); display: flex; align-items: center; justify-content: center; padding: 0 18px">
<div role="dialog" aria-modal="true" aria-labelledby="srqReadyTitle" style="position: relative; width: 100%; box-sizing: border-box; padding: 16px; color: #2A1A0E; border-radius: 2px; transform: rotate(-0.8deg); background: repeating-linear-gradient(0deg, rgba(110,80,40,0.03) 0 1px, rgba(0,0,0,0) 1px 4px), linear-gradient(180deg, #F7ECD3, #EAD9B6); box-shadow: 0 18px 40px rgba(0,0,0,0.7), inset 0 0 30px rgba(120,80,30,0.18)">
<span aria-hidden="true" style="position: absolute; top: -7px; left: 50%; margin-left: -7px; width: 14px; height: 14px; border-radius: 999px; background: radial-gradient(circle at 35% 35%, #F5D891, #8C6224); box-shadow: 0 3px 5px rgba(0,0,0,0.45)"></span>
<div style="border: 1.5px solid #2A1A0E">
<div style="padding: 10px 12px 8px; border-bottom: 1.5px solid #2A1A0E; background: rgba(42,26,14,0.05)">
<span style="display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #7A1222">A note from backstage</span>
<h2 id="srqReadyTitle" style="margin: 2px 0 0; font-family: Fraunces, Georgia, serif; font-size: 19px; font-weight: 600">Your last performance is ready.</h2>
</div>
<div style="padding: 10px 12px 12px; border-bottom: 1px solid #2A1A0E; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 12px; color: #5A4330">The coach finished your notes while you were away.</span>
<span style="margin-top: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #5A4330">Topic</span>
<span style="font-family: Fraunces, Georgia, serif; font-size: 16px; font-weight: 600; line-height: 1.2">Is failure a better teacher than success?</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #5A4330">Today, 9:41 pm · 2:47</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px">
<button type="button" onClick="{{dismiss}}" style="height: 44px; padding: 0 4px; border: 0; background: transparent; cursor: pointer; color: #5A4330; font: 600 13px Manrope, system-ui, sans-serif; text-decoration: underline; text-underline-offset: 4px">Not now</button>
<a href="F2BackstagePhone.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px; color: #7A1222; text-decoration: underline; text-underline-offset: 4px; font: 800 14px Manrope, system-ui, sans-serif">See your notes<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":780}}'>
class Component extends DCLogic {
renderVals() {
const show = !(this.state && this.state.hidden);
return { show: show, dismiss: () => this.setState({ hidden: true }) };
}
}
</script>
</body>
</html>
