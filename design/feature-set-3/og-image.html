<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share preview picture (1200x630)</title>
<!-- Never deployed. The source of site/og-image.png: F22Share kind="split" (F22Share.dc.html:124-155).
     make-icon-share.mjs renders it at exactly 1200x630. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Manrope:wght@600;800&amp;display=swap">
<style>
html, body { margin: 0; overflow: hidden; background: #1A0B0A; }
.card { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: Manrope, system-ui, sans-serif; background: #1A0B0A; }

/* Left half: the words */
.words { position: absolute; left: 0; top: 0; bottom: 0; width: 600px; box-sizing: border-box; padding: 70px 60px;
  display: flex; flex-direction: column; justify-content: center; gap: 22px;
  background: radial-gradient(ellipse 80% 60% at 0% 0%, rgba(140, 20, 38, 0.35), rgba(0, 0, 0, 0) 70%), #1A0B0A; }
.logo { display: flex; align-items: center; gap: 9px; }
.name { font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600; color: #FFF6E3; }
.name span { color: #D9AE52; }
.beta { padding: 3px 11px; border: 5px double #D9AE52; border-radius: 4px; color: #F0CF86; font: 800 11px Manrope, system-ui, sans-serif;
  letter-spacing: 0.22em; transform: rotate(-6deg); }
.headline { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 66px; font-weight: 600; line-height: 1.06; color: #FFF6E3; }
.tick { display: flex; align-items: center; gap: 14px; font-size: 27px; font-weight: 600; color: #F1E2CC; }

/* Right half: the stage */
.stage { position: absolute; left: 600px; top: 0; right: 0; bottom: 0; overflow: hidden;
  background: radial-gradient(ellipse 50% 70% at 50% 20%, rgba(255, 226, 170, 0.35), rgba(255, 226, 170, 0.05) 60%, rgba(0, 0, 0, 0) 80%), #241009; }
.curtain { position: absolute; top: 0; bottom: 0; width: 120px; }
.curtain.left { left: 0; box-shadow: inset -3px 0 0 #D9AE52;
  background: repeating-linear-gradient(90deg, #4A0812 0, #8C1426 16px, #B8283A 26px, #8C1426 36px, #4A0812 52px); }
.curtain.right { right: 0; box-shadow: inset 3px 0 0 #D9AE52;
  background: repeating-linear-gradient(270deg, #4A0812 0, #8C1426 16px, #B8283A 26px, #8C1426 36px, #4A0812 52px); }
.floor { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; border-top: 4px solid #B8893A;
  background: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.18) 0 2px, rgba(0, 0, 0, 0) 2px 120px), linear-gradient(180deg, #8A5A2E, #5E3A1C); }
.mic { position: absolute; left: 50%; bottom: 150px; margin-left: -120px; width: 240px; height: 312px; overflow: visible; }
.mic-shadow { position: absolute; left: 50%; bottom: 143px; margin-left: -80px; width: 160px; height: 18px; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 40%, #4A4A50, #1A1A1D 70%); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.6); }
</style>
</head>
<body>
<div class="card">
  <div class="words">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect x="3" y="11" width="3" height="6" rx="1.5" fill="#D9AE52"></rect><rect x="9" y="6" width="3" height="16" rx="1.5" fill="#D9AE52"></rect><rect x="15" y="3" width="3" height="22" rx="1.5" fill="#D9AE52"></rect><rect x="21" y="9" width="3" height="10" rx="1.5" fill="#D9AE52"></rect></svg>
      <span class="name">Speak<span>Review</span></span>
      <span class="beta">BETA</span>
    </div>
    <h1 class="headline">Practice your speech with an AI coach.</h1>
    <div class="tick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D9AE52" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Record or upload a speech</div>
    <div class="tick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D9AE52" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Get notes from your coach</div>
    <div class="tick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#D9AE52" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Replay it, word by word</div>
  </div>

  <div class="stage" aria-hidden="true">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <div class="floor"></div>
    <!-- The site's own mic: the #micBtn SVG in site/index.html, copied unchanged except for the glow
         (filled here, since the page's .mic-glow class and its pulse don't exist on this page) -->
    <svg class="mic" viewBox="0 0 200 260">
      <defs>
        <radialGradient id="micGrille" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.45" stop-color="#C9CCD3"></stop><stop offset="1" stop-color="#5E6168"></stop></radialGradient>
        <linearGradient id="micBody" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2A2A2E"></stop><stop offset="0.45" stop-color="#5A5B61"></stop><stop offset="1" stop-color="#1A1A1D"></stop></linearGradient>
      </defs>
      <circle cx="100" cy="68" r="80" fill="rgba(217,174,82,0.30)"></circle>
      <path d="M74 118 L126 118 L112 196 L88 196 Z" fill="url(#micBody)"></path>
      <rect x="68" y="108" width="64" height="14" rx="5" fill="#B9BCC3"></rect>
      <circle cx="100" cy="68" r="50" fill="url(#micGrille)"></circle>
      <circle cx="100" cy="68" r="50" fill="none" stroke="#8E9198" stroke-width="3"></circle>
      <circle cx="100" cy="68" r="40" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"></circle>
      <circle cx="100" cy="68" r="30" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1.5"></circle>
      <circle cx="100" cy="68" r="20" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"></circle>
      <path d="M54 68 H146 M100 22 V114" stroke="rgba(0,0,0,0.10)" stroke-width="1.5"></path>
      <ellipse cx="82" cy="46" rx="17" ry="9" fill="rgba(255,255,255,0.6)" transform="rotate(-25 82 46)"></ellipse>
      <rect x="91" y="194" width="18" height="16" rx="3" fill="#2B2B2F"></rect>
      <rect x="97" y="208" width="6" height="52" fill="#3A3A3F"></rect>
    </svg>
    <div class="mic-shadow"></div>
  </div>
</div>
</body>
</html>
