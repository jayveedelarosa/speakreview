<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intermission with progress (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&amp;family=JetBrains+Mono:wght@500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes srqGlowP{0%,100%{box-shadow:0 0 8px 3px rgba(255,200,120,0.45)}50%{box-shadow:0 0 18px 7px rgba(255,210,130,0.85)}}
.srq-cur{animation:srqGlowP 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.srq-cur{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 780px; position: relative; overflow: hidden; background: #1A0B0A; color: #EFE2CF; font-family: Manrope, system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 0; width: 50.5%; box-shadow: inset -2px 0 0 #D9AE52, 8px 0 30px rgba(0,0,0,0.6); background: linear-gradient(90deg, rgba(0,0,0,0.35), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.45)), repeating-linear-gradient(90deg, #4A0812 0, #8C1426 12px, #B8283A 20px, #8C1426 28px, #4A0812 40px)"></div>
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; right: 0; width: 50.5%; box-shadow: inset 2px 0 0 #D9AE52, -8px 0 30px rgba(0,0,0,0.6); background: linear-gradient(270deg, rgba(0,0,0,0.35), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.45)), repeating-linear-gradient(270deg, #4A0812 0, #8C1426 12px, #B8283A 20px, #8C1426 28px, #4A0812 40px)"></div>
<div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 36px; border-bottom: 3px solid #D9AE52; box-shadow: 0 8px 24px rgba(0,0,0,0.45); background: repeating-linear-gradient(90deg, #4A0812 0, #8C1426 8px, #B8283A 13px, #8C1426 18px, #4A0812 26px)"></div>
<div aria-hidden="true" style="position: absolute; top: 39px; left: 0; right: 0; height: 12px; background: radial-gradient(circle at 50% 0, #8C1426 0 9px, rgba(0,0,0,0) 10px) 0 0 / 22px 12px repeat-x"></div>

<div role="status" aria-live="polite" style="position: absolute; left: 18px; right: 18px; top: 56px; bottom: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase; color: #F0CF86; text-shadow: 0 2px 10px rgba(0,0,0,0.8)">SpeakReview</span>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 44px; letter-spacing: -0.02em; color: #FFF6E3; text-shadow: 0 6px 24px rgba(0,0,0,0.6)">Intermission</h1>
<span style="font-size: 15px; color: #F6E4CC; text-shadow: 0 2px 10px rgba(0,0,0,0.8)">Your coach is reviewing your speech.</span>

<div style="margin-top: 8px; position: relative; width: 100%; box-sizing: border-box; padding: 13px; border-radius: 14px; background: linear-gradient(160deg, #8A5A2E, #4A2A14 55%, #6E4522); box-shadow: 0 14px 30px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(240,207,134,0.35)">
<sc-for list="{{frameBulbs}}" as="b" hint-placeholder-count="18"><span aria-hidden="true" style="position: absolute; width: 8px; height: 8px; border-radius: 999px; background: radial-gradient(circle at 40% 35%, #FFFFFF, #FFDFA0 60%); box-shadow: 0 0 5px 2px rgba(255,200,120,0.6); {{b.pos}}"></span></sc-for>
<div style="padding: 16px 16px 6px; border-radius: 6px; text-align: left; background: radial-gradient(ellipse 80% 70% at 50% 0%, rgba(255,220,170,0.08), rgba(0,0,0,0) 70%), linear-gradient(180deg, #1C0E0B, #0F0705); box-shadow: inset 0 0 20px rgba(0,0,0,0.7); display: flex; flex-direction: column">
<sc-for list="{{acts}}" as="a" hint-placeholder-count="3">
<div style="display: flex; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center; width: 32px">
<span aria-hidden="true" class="{{a.cls}}" style="width: 30px; height: 30px; flex: none; box-sizing: border-box; border-radius: 999px; display: flex; align-items: center; justify-content: center; {{a.bulb}}"><sc-if value="{{a.done}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A1E08" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
<span aria-hidden="true" style="width: 12px; height: 4px; margin-top: -2px; flex: none; border-radius: 0 0 3px 3px; background: linear-gradient(180deg, #B8893A, #6E4A1E)"></span>
<sc-if value="{{a.hasLine}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="flex: 1; min-height: 14px; width: 0; margin: 4px 0; {{a.line}}"></span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 12px">
<span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; {{a.kickerColor}}">{{a.kicker}}</span><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; {{a.stateColor}}">{{a.state}}</span></span>
<span style="font-size: 15px; font-weight: 700; {{a.titleColor}}">{{a.title}}</span>
<span style="font-size: 12px; line-height: 1.35; {{a.subColor}}">{{a.sub}}</span>
</div>
</div>
</sc-for>
</div>
</div>

<span style="margin-top: 4px; font-size: 13px; line-height: 1.45; color: #F1E2CC; text-shadow: 0 2px 10px rgba(0,0,0,0.85)">Usually under a minute. You can switch apps or close the page: your notes will be waiting.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["1","2","3"],"default":"2"},"$preview":{"width":390,"height":780}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => {
const cur = (this.state && this.state.step) || Number(this.props.step || 2);
this.setState({ step: cur >= 3 ? 1 : cur + 1 });
}, 2600);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const step = (this.state && this.state.step) || Number(this.props.step || 2);
const list = [
step === 1
? { n: 1, kicker: 'Act I', title: 'Sending', sub: 'Sending your recording to your coach' }
: { n: 1, kicker: 'Act I', title: 'Arrived', sub: 'Your coach has it' },
{ n: 2, kicker: 'Act II', title: 'Transcribing', sub: 'Writing down every word' },
{ n: 3, kicker: 'Act III', title: "Coach's notes", sub: 'Reading and writing your feedback' }
];
const acts = list.map((a) => {
const done = a.n < step, cur = a.n === step;
return {
kicker: a.kicker, title: a.title, sub: a.sub,
done: done, hasLine: a.n < 3,
cls: cur ? 'srq-cur' : '',
state: done ? 'Done' : (cur ? 'Now playing' : 'Next'),
stateColor: done ? 'color: #F0CF86;' : (cur ? 'color: #FFE7B0;' : 'color: #A8977F;'),
line: a.n < step ? 'border-left: 2px solid #D9AE52;' : 'border-left: 2px dashed rgba(246,234,211,0.3);',
bulb: done
? 'background: radial-gradient(circle at 40% 35%, #FFF3D6, #F0CF86 55%, #C9963E); box-shadow: 0 0 8px 3px rgba(255,200,120,0.5);'
: (cur ? 'background: radial-gradient(circle at 40% 35%, #FFFFFF, #FFE7B0 45%, #E8A84A);' : 'background: radial-gradient(circle at 40% 35%, #8A6A4A, #3A2416 70%); border: 1px solid rgba(246,234,211,0.22);'),
kickerColor: done || cur ? 'color: #F0CF86;' : 'color: #A8977F;',
titleColor: cur ? 'color: #FFF6E3;' : (done ? 'color: #EFE2CF;' : 'color: #BCA992;'),
subColor: done || cur ? 'color: #D8C6AE;' : 'color: #A8977F;'
};
});
const W = 354, n = 9, bulbs = [];
for (let i = 0; i < n; i++) {
const x = 16 + i * ((W - 32 - 8) / (n - 1));
bulbs.push({ pos: 'left: ' + x.toFixed(1) + 'px; top: 2.5px;' });
bulbs.push({ pos: 'left: ' + x.toFixed(1) + 'px; bottom: 2.5px;' });
}
return { acts: acts, frameBulbs: bulbs };
}
}
</script>
</body>
</html>
