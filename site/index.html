<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakReview | AI Speech Feedback</title>
<meta name="description" content="SpeakReview gives you AI feedback on your speeches: filler words, speaking pace and personalized tips.">
<meta property="og:title" content="SpeakReview">
<meta property="og:description" content="Upload a speech and get AI feedback on filler words, pace and delivery.">
<meta property="og:url" content="https://speakreview.jayveedelarosa.dev">

<link rel="stylesheet" href="css/styles.css">
<script src="js/app.js" defer></script>
</head>

<body>

<div class="app">
    <header class="app-header">
        <h1>SpeakReview</h1>
        <p class="subtitle">AI-Powered Speech Performance Analysis</p>
    </header>

    <div class="tab-bar" role="tablist" aria-label="Sections">
        <button type="button" class="tab" id="tabPractice" role="tab" aria-selected="true" aria-controls="panelPractice">Practice</button>
        <!-- Stage 4: remove "hidden" to show the History tab -->
        <button type="button" class="tab" id="tabHistory" role="tab" aria-selected="false" aria-controls="panelHistory" tabindex="-1" hidden>History</button>
    </div>

    <main>
        <section id="panelPractice" role="tabpanel" aria-labelledby="tabPractice">
            <div class="steps">

                <!-- Stage 2: remove "hidden" to show the Topic step -->
                <section class="card step" id="stepTopic" aria-labelledby="stepTopicTitle" hidden>
                    <h2 class="card-title" id="stepTopicTitle">Topic</h2>
                </section>

                <!-- Stage 2: remove "hidden" to show the Time step -->
                <section class="card step" id="stepTime" aria-labelledby="stepTimeTitle" hidden>
                    <h2 class="card-title" id="stepTimeTitle">Time</h2>
                </section>

                <section class="card step" id="stepSpeak" aria-labelledby="stepSpeakTitle">
                    <h2 class="card-title" id="stepSpeakTitle">Speak</h2>

                    <!-- Stage 3: live recording option (mic button, preparation countdown, stopwatch) goes here -->

                    <div class="upload-box" id="dropZone">
                        <input type="file" id="audioFile" class="file-input-hidden" accept=".mp3,audio/mpeg">
                        <label for="audioFile" class="file-picker-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            Choose File
                        </label>

                        <span id="fileName" class="file-name">No File Chosen</span>
                    </div>

                    <button type="button" id="uploadBtn" class="btn-primary">Begin Analysis</button>

                    <p id="status" role="status" aria-live="polite"></p>
                    <p id="waitNote" class="wait-note" style="display:none;">Longer speeches can take a few minutes to analyze. Please keep this page open.</p>

                    <p class="privacy-note">Recordings are used only to create your feedback.<br>They are deleted automatically after 7 days, and results after 30 days.</p>
                </section>

                <section id="result" class="card result-card" aria-label="Results" style="display:none;">
                </section>

            </div>
        </section>

        <!-- Stage 4: remove "hidden" to show the History panel -->
        <section id="panelHistory" role="tabpanel" aria-labelledby="tabHistory" hidden>
            <div class="card">
                <h2 class="card-title">History</h2>
            </div>
        </section>
    </main>
</div>

</body>
</html>
